; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; Official platformio/espressif32 is stuck on Arduino core 2.0.17, which does
; not support USB on the S3 at all. pioarduino's fork ships a current
; Arduino 3.x core with TinyUSB and is a drop-in platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
; Debug output goes to Serial1 (D5/D6); the native USB port carries no CDC
; in host mode. monitor_* kept for convenience should a future sketch use it.
monitor_speed = 115200
monitor_port = COM13
upload_port = COM12
; USB MIDI HOST mode: the XIAO's single OTG port runs TinyUSB host; the
; instrument (OP-1 field, see the host diagnostics in description-v2.md)
; enumerates as a USB device on the OTG adapter. MIDI input (recording) and
; output (playback/preview) both go through the mounted TUH MIDI interface
; (see midi_engine.cpp).
;
;   ARDUINO_USB_MODE=0            TinyUSB (dual-role capable) build.
;   ARDUINO_USB_ON_BOOT=0         Do NOT auto-start the USB *device* stack;
;                                 the port is reserved for host use.
;   ARDUINO_USB_CDC_ON_BOOT=0     No CDC device either (debug is on Serial1).
;
; ARDUINO_HOST_ENV=1 compiles lib/usb-host-enumeration-fix/usbh.c with
; CFG_TUH_ENUMERATION_BUFSIZE=1024: composite audio+MIDI devices (OP-1
; field's config descriptor is ~450-700 B) exceed the 256 B size the core's
; prebuilt libarduino_tinyusb.a archive was compiled with, and that constant
; is not configurable from outside - the link-time override replaces it.
; The stock two TinyUSB include dirs are already global (board builder);
; the extra -I dirs below only serve library sources whose library.json
; build.flags this platform's builder script does not apply.
build_flags =
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_ON_BOOT=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_HOST_ENV=1
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/tinyusb/src
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/include
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/tinyusb/src/device
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/tinyusb/src/class/midi
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/tinyusb/src/portable/synopsys/dwc2
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32-libs/esp32s3/include/arduino_tinyusb/tinyusb/src/host
build_unflags = -DARDUINO_USB_MODE=1
lib_deps =
	adafruit/Adafruit SHARP Memory Display@^1.1.4


