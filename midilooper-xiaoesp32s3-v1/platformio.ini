; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; Official platformio/espressif32 is stuck on Arduino core 2.0.17, which does
; not support native USB MIDI on the S3 (Control Surface requires arduino-esp32
; >= 3.x for its ESP32-S2/S3 USB backend and otherwise silently falls back to
; MIDI-over-serial, which is why the device enumerated as a serial port).
; pioarduino's fork ships a current Arduino 3.x core and is a drop-in platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_port = COM13
upload_port = COM12
; The framework's bundled USB library (needed for native USB MIDI) pulls in
; USBHostMSC.cpp, which needs FS.h; LDF doesn't reliably add either include
; path on its own, so both are added explicitly here (the ${platformio...}
; variable form got corrupted by the board builder script, so this is hardcoded).
build_flags =
	-DARDUINO_USB_MODE=0
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32/libraries/FS/src
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32/libraries/USB/src
build_unflags = -DARDUINO_USB_MODE=1
; test_midi.cpp / midi_host_test.cpp are standalone sketches (own setup/loop);
; excluding them here keeps the main firmware link clean.
build_src_filter = +<*> -<test_midi.cpp> -<midi_host_test.cpp>
lib_deps = 
	tttapa/Control Surface@^2.1.0
	adafruit/Adafruit SHARP Memory Display@^1.1.4

; ---------------------------------------------------------------------------
; USB MIDI HOST test (src/midi_host_test.cpp): the XIAO acts as USB-MIDI host,
; enumerating a device (OP-1 field etc.) on the OTG port and logging received
; events on Serial1 D5/D6 @ 921600. Uses the core's USBHost class (TUH runs on
; a background worker at priority 17). Hardware: USB-C OTG adapter; the
; attached device is powered from the XIAO's 5V rail.
;   pio run -e midi_host_test -t upload
; ---------------------------------------------------------------------------
[env:midi_host_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
; NOTE: monitor_speed/monitor_port unused here - logs go to Serial1 (D5/D6).
upload_port = COM12
; Prevent the core from auto-starting the USB *device* stack at boot so the
; port is free for host mode; the USB device library is not linked at all.
build_flags =
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_ON_BOOT=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	; Build lib/tinyusb-instrumented's usbh.c with a 1024-byte host
	; enumeration buffer (the archive member is prebuilt with the core's 256)
	; instead of relying on the framework tusb_config.h patch, which cannot
	; reach already-compiled archive objects.
	-DARDUINO_HOST_ENV=1
build_unflags = -DARDUINO_USB_MODE=1
; USB MIDI device support: CFG_TUH_MIDI=1 in the core tusb_config.h; the
; prebuilt midi_host.c.obj handles class enumeration. The framework's
; CFG_TUH_ENUMERATION_BUFSIZE was raised 256 -> 1024 (patched in
; framework-arduinoespressif32-libs/.../tusb_config.h, backup .orig-256buf)
; because the OP-1 field's composite audio+MIDI configuration descriptor
; because the OP-1 field's composite audio+MIDI configuration descriptor
; exceeds 256 B and the core hardcodes that value non-overridably.
; The TinyUSB headers (CFG_TUH_MIDI=1 is on by default in the core's
; tusb_config.h; midi_host.c.obj is prebuilt in libarduino_tinyusb.a) come
; from the framework's arduino_tinyusb include tree, added automatically by
; the board builder script.
build_src_filter = +<midi_host_test.cpp>
lib_deps =

; ---------------------------------------------------------------------------
; Minimal USB MIDI RX test (src/test_midi.cpp): raw core USBMIDI class only,
; no Control Surface, no app logic. Debug output on Serial1 (D5/D6, 921600).
; Switch: PlatformIO project env selector ("midi_test"), or:
;   pio run -e midi_test -t upload
; Same platform/board/flags as the main env on purpose: this isolates the RX
; issue between the core/TinyUSB/DWC2 stack and Control Surface.
; ---------------------------------------------------------------------------
[env:midi_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 921600
monitor_port = COM13
upload_port = COM12
build_flags =
	-DARDUINO_USB_MODE=0
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32/libraries/FS/src
	-IC:/Users/pfreyerm/.platformio/packages/framework-arduinoespressif32/libraries/USB/src
	; USB MIDI RX instrumentation: rebuilds dcd_dwc2/usbd/tusb/midi_device with
	; midi_diag ring-buffer hooks (see lib/tinyusb-instrumented). Remove to link
	; the untouched prebuilt libarduino_tinyusb.a objects instead.
	-DMIDI_DIAG=1
build_unflags = -DARDUINO_USB_MODE=1
; Only build the standalone test sketch (it provides setup()/loop() itself).
build_src_filter = +<test_midi.cpp>
